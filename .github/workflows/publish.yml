# Publishes to pub.dev automatically when a version tag is pushed.
#
# SETUP (one-time, per maintainer):
# 1. Go to https://pub.dev/packages/simple_logger_overlay/admin
# 2. Under "Automated publishing", click "Enable publishing from GitHub Actions"
# 3. Set repository to "sam829/simple_logger_overlay"
#    and tag pattern "v[0-9]+.[0-9]+.[0-9]+"
# 4. Done — no secrets needed. pub.dev trusts the OIDC token GitHub mints.
#
# RELEASE FLOW:
# 1. Bump version in pubspec.yaml + CHANGELOG, commit, push to develop/main
# 2. git tag v1.2.3 && git push origin v1.2.3
# → analyze + publish runs automatically

name: Publish to pub.dev

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  analyze:
    name: Analyze & dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/ --fatal-infos

      - name: Dry-run publish
        run: dart pub publish --dry-run

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: analyze
    # Only publish on tag pushes — branch pushes only run the analyze job above
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for OIDC authentication with pub.dev
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: dart pub publish --force
