<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background gradient: dark left → slightly lighter right -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#13151A" />
      <stop offset="100%" style="stop-color:#1E2229" />
    </linearGradient>

    <!-- Green accent gradient (left bar + FAB) -->
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#62C99A" />
      <stop offset="100%" style="stop-color:#3A9E70" />
    </linearGradient>

    <!-- Panel gradient -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2D36" />
      <stop offset="100%" style="stop-color:#1C1F26" />
    </linearGradient>

    <!-- Right fade mask so panel blends into bg -->
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    <mask id="panelFade">
      <rect x="560" y="0" width="640" height="300" fill="url(#fadeMask)" />
    </mask>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ── BACKGROUND ───────────────────────────────────────── -->
  <rect width="1200" height="300" fill="url(#bg)" />

  <!-- Subtle noise/grid overlay -->
  <rect width="1200" height="300" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.02" />

  <!-- Diagonal accent shape (top-right) -->
  <polygon points="900,0 1200,0 1200,180" fill="#52B788" opacity="0.04" />

  <!-- Left vertical accent bar -->
  <rect x="0" y="0" width="6" height="300" fill="url(#green)" />

  <!-- ── LEFT BRANDING ─────────────────────────────────────── -->

  <!-- Mini icon mark (64×64) -->
  <rect x="40" y="98" width="64" height="64" rx="14" fill="url(#green)" />
  <!-- Panel inside icon -->
  <rect x="49" y="111" width="46" height="38" rx="5" fill="#1C1F26" />
  <!-- Icon top bar -->
  <rect x="49" y="111" width="46" height="11" rx="5" fill="#2A2D36" />
  <rect x="49" y="117" width="46" height="5" fill="#2A2D36" />
  <!-- Icon dots -->
  <circle cx="56" cy="117" r="2.5" fill="#FF6B6B" opacity="0.9" />
  <circle cx="63" cy="117" r="2.5" fill="#FFD166" opacity="0.9" />
  <circle cx="70" cy="117" r="2.5" fill="#52B788" opacity="0.9" />
  <!-- Icon log lines -->
  <rect x="55" y="127" width="7" height="3.5" rx="1.75" fill="#40C9AA" />
  <rect x="65" y="127" width="22" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.6" />
  <rect x="55" y="134" width="7" height="3.5" rx="1.75" fill="#7CB8FF" />
  <rect x="65" y="134" width="17" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.6" />
  <rect x="55" y="141" width="7" height="3.5" rx="1.75" fill="#FF8A80" />
  <rect x="65" y="141" width="19" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.6" />

  <!-- Package name -->
  <!-- "simple_" -->
  <text x="120" y="148" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace"
    font-size="34" font-weight="600" letter-spacing="-0.5" fill="#FFFFFF" opacity="0.95">Simple </text>
  <!-- "logger" in green -->
  <text x="120" y="148" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace"
    font-size="34" font-weight="600" letter-spacing="-0.5" fill="#FFFFFF" opacity="0.95" x="120">
    <tspan fill="#FFFFFF" opacity="0.95">Simple</tspan>
    <tspan fill="#52B788"> Logger </tspan>
    <tspan fill="#FFFFFF" opacity="0.95">Overlay</tspan>
  </text>

  <!-- Tagline -->
  <text x="122" y="174" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="15" letter-spacing="0.3" fill="#FFFFFF" opacity="0.45">
    Material You · In-app debug overlay · Flutter
  </text>

  <!-- Pill badges -->
  <!-- Dart 3+ pill -->
  <rect x="122" y="192" width="62" height="22" rx="11" fill="#0175C2" opacity="0.25" />
  <rect x="122" y="192" width="62" height="22" rx="11" fill="none" stroke="#0175C2" stroke-width="1"
    opacity="0.5" />
  <text x="153" y="207" font-family="'Inter', Arial, sans-serif" font-size="11"
    font-weight="600" fill="#54C5F8" text-anchor="middle" opacity="0.9">Dart 3+</text>

  <!-- MIT pill -->
  <rect x="192" y="192" width="46" height="22" rx="11" fill="#52B788" opacity="0.18" />
  <rect x="192" y="192" width="46" height="22" rx="11" fill="none" stroke="#52B788" stroke-width="1"
    opacity="0.4" />
  <text x="215" y="207" font-family="'Inter', Arial, sans-serif" font-size="11"
    font-weight="600" fill="#52B788" text-anchor="middle" opacity="0.9">MIT</text>

  <!-- pub.dev pill -->
  <rect x="246" y="192" width="60" height="22" rx="11" fill="#FFFFFF" opacity="0.06" />
  <rect x="246" y="192" width="60" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-width="1"
    opacity="0.15" />
  <text x="276" y="207" font-family="'Inter', Arial, sans-serif" font-size="11"
    font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.55">pub.dev</text>

  <!-- ── DIVIDER ─────────────────────────────────────────── -->
  <line x1="530" y1="40" x2="530" y2="260" stroke="#FFFFFF" stroke-width="1" opacity="0.07" />

  <!-- ── RIGHT: OVERLAY PANEL PREVIEW ─────────────────────── -->
  <g mask="url(#panelFade)">

    <!-- Main panel -->
    <rect x="568" y="24" width="600" height="252" rx="20" fill="url(#panel)"
      filter="url(#softShadow)" />

    <!-- Panel header bar -->
    <rect x="568" y="24" width="600" height="46" rx="20" fill="#2E3140" />
    <rect x="568" y="44" width="600" height="26" fill="#2E3140" />
    <!-- Header dots -->
    <circle cx="606" cy="47" r="7" fill="#FF6B6B" opacity="0.8" />
    <circle cx="628" cy="47" r="7" fill="#FFD166" opacity="0.8" />
    <circle cx="650" cy="47" r="7" fill="#52B788" opacity="0.8" />
    <!-- Header title shimmer -->
    <rect x="678" y="42" width="88" height="8" rx="4" fill="#FFFFFF" opacity="0.18" />
    <!-- Search bar stub -->
    <rect x="800" y="36" width="148" height="22" rx="11" fill="#FFFFFF" opacity="0.06" />
    <rect x="800" y="36" width="148" height="22" rx="11" fill="none" stroke="#FFFFFF"
      stroke-width="1" opacity="0.1" />
    <rect x="816" y="44" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.2" />
    <!-- Sort icon -->
    <rect x="964" y="38" width="18" height="3" rx="1.5" fill="#FFFFFF" opacity="0.3" />
    <rect x="967" y="45" width="12" height="3" rx="1.5" fill="#FFFFFF" opacity="0.3" />
    <rect x="970" y="52" width="6" height="3" rx="1.5" fill="#FFFFFF" opacity="0.3" />

    <!-- Tab bar -->
    <rect x="568" y="70" width="600" height="1" fill="#FFFFFF" opacity="0.05" />
    <rect x="578" y="72" width="86" height="24" rx="4" fill="#52B788" opacity="0.15" />
    <rect x="578" y="88" width="86" height="3" rx="1.5" fill="#52B788" />
    <text x="621" y="88" font-family="'Inter', Arial, sans-serif" font-size="12"
      font-weight="600" fill="#52B788" text-anchor="middle">Logs (3)</text>
    <text x="714" y="88" font-family="'Inter', Arial, sans-serif" font-size="12"
      font-weight="500" fill="#FFFFFF" text-anchor="middle" opacity="0.4">Network (1)</text>

    <!-- ── Log row 1: DEBUG ── -->
    <rect x="580" y="102" width="572" height="44" rx="10" fill="#FFFFFF" opacity="0.03" />
    <rect x="580" y="102" width="4" height="44" rx="2" fill="#40C9AA" />
    <!-- Icon halo + dot -->
    <circle cx="608" cy="124" r="13" fill="#40C9AA" opacity="0.12" />
    <circle cx="608" cy="124" r="7" fill="#40C9AA" />
    <!-- Text -->
    <rect x="628" y="112" width="200" height="9" rx="4.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="628" y="126" width="130" height="7" rx="3.5" fill="#FFFFFF" opacity="0.28" />
    <!-- Tag pill -->
    <rect x="840" y="113" width="72" height="18" rx="9" fill="#40C9AA" opacity="0.15" />
    <rect x="854" y="119" width="44" height="6" rx="3" fill="#40C9AA" opacity="0.7" />
    <!-- Timestamp -->
    <rect x="930" y="119" width="54" height="6" rx="3" fill="#FFFFFF" opacity="0.18" />
    <!-- Chevron -->
    <polyline points="1000,120 1006,124 1000,128" fill="none" stroke="#FFFFFF" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

    <!-- ── Log row 2: INFO ── -->
    <rect x="580" y="153" width="572" height="44" rx="10" fill="#FFFFFF" opacity="0.03" />
    <rect x="580" y="153" width="4" height="44" rx="2" fill="#7CB8FF" />
    <circle cx="608" cy="175" r="13" fill="#7CB8FF" opacity="0.12" />
    <circle cx="608" cy="175" r="7" fill="#7CB8FF" />
    <rect x="628" y="163" width="168" height="9" rx="4.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="628" y="177" width="108" height="7" rx="3.5" fill="#FFFFFF" opacity="0.28" />
    <rect x="840" y="164" width="80" height="18" rx="9" fill="#7CB8FF" opacity="0.15" />
    <rect x="854" y="170" width="52" height="6" rx="3" fill="#7CB8FF" opacity="0.7" />
    <rect x="930" y="170" width="54" height="6" rx="3" fill="#FFFFFF" opacity="0.18" />
    <polyline points="1000,171 1006,175 1000,179" fill="none" stroke="#FFFFFF" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

    <!-- ── Log row 3: ERROR ── -->
    <rect x="580" y="204" width="572" height="44" rx="10" fill="#FF6B6B" opacity="0.05" />
    <rect x="580" y="204" width="4" height="44" rx="2" fill="#FF8A80" />
    <circle cx="608" cy="226" r="13" fill="#FF8A80" opacity="0.18" />
    <circle cx="608" cy="226" r="7" fill="#FF8A80" />
    <rect x="628" y="214" width="216" height="9" rx="4.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="628" y="228" width="144" height="7" rx="3.5" fill="#FFFFFF" opacity="0.28" />
    <rect x="840" y="215" width="68" height="18" rx="9" fill="#FF8A80" opacity="0.15" />
    <rect x="854" y="221" width="40" height="6" rx="3" fill="#FF8A80" opacity="0.7" />
    <rect x="930" y="221" width="54" height="6" rx="3" fill="#FFFFFF" opacity="0.18" />
    <polyline points="1000,222 1006,226 1000,230" fill="none" stroke="#FFFFFF" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

    <!-- ── FAB ── -->
    <circle cx="1108" cy="236" r="32" fill="url(#green)" filter="url(#softShadow)" />
    <circle cx="1108" cy="236" r="32" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
    <rect x="1094" y="226" width="28" height="4" rx="2" fill="#FFFFFF" />
    <rect x="1094" y="234" width="20" height="4" rx="2" fill="#FFFFFF" opacity="0.75" />
    <rect x="1094" y="242" width="24" height="4" rx="2" fill="#FFFFFF" opacity="0.5" />

  </g>

  <!-- ── BOTTOM STRIP ────────────────────────────────────── -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#green)" opacity="0.6" />
</svg>